name: CI/CD Pipeline

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  # Build and test job
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint code
        run: npm run lint

      - name: Type check
        run: tsc -b

      - name: Build application
        run: npm run build
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
          VITE_BACKEND_API_VERSION: ${{ secrets.VITE_BACKEND_API_VERSION }}

  # Docker build and push (only for main branch)
  docker-build-and-push:
    needs: build-and-test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Private Docker Registry
        uses: docker/login-action@v3
        with:
          registry: lyckabc.xyz/registry
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: lyckabc.xyz/registry/gopediafe:latest
          target: production
          build-args: |
            VITE_API_URL=${{ secrets.VITE_API_URL }}
            VITE_BACKEND_API_VERSION=${{ secrets.VITE_BACKEND_API_VERSION }}

  # Deploy to staging (only for develop branch)
  deploy-staging:
    needs: build-and-test
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Private Docker Registry
        uses: docker/login-action@v3
        with:
          registry: lyckabc.xyz/registry
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: lyckabc.xyz/registry/gopediafe:staging
          target: production
          build-args: |
            VITE_API_URL=${{ secrets.VITE_API_URL }}
            VITE_BACKEND_API_VERSION=${{ secrets.VITE_BACKEND_API_VERSION }}

      - name: Deploy to Staging Server
        uses: appleboy/ssh-action@master
        with:
          host: lyckabc.xyz
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          script: |
            cd /root/dev/docker/gopediafe
            docker-compose pull gopediafe-dev
            docker-compose down gopediafe-dev
            docker-compose up -d gopediafe-dev
